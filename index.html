<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cavite - Noveleta Live Traffic & Tide Tracker</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: #f4f6f9; color: #333; padding-bottom: 80px; }
        
        header { background-color: #1a73e8; color: white; padding: 16px; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 6px rgba(0,0,0,0.15); }
        header h1 { font-size: 1.1rem; font-weight: 700; }
        .clock-banner { font-size: 0.75rem; font-weight: 600; background: rgba(255,255,255,0.2); padding: 4px 8px; border-radius: 20px; display: inline-block; margin-top: 4px; }
        
        .admin-toggle-btn { position: absolute; top: 16px; right: 16px; background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.4); color: white; padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer; }
        .admin-toggle-btn.active { background: #c62828; border-color: #ff8a80; }

        /* Flood & Tide Alert Widget */
        .flood-widget { background: #ffffff; border-radius: 12px; padding: 12px 14px; margin: 12px auto; max-width: 600px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); border-left: 5px solid #0288d1; }
        .flood-header { display: flex; justify-content: space-between; align-items: center; font-size: 0.9rem; font-weight: 700; color: #0288d1; margin-bottom: 6px; }
        .flood-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 0.78rem; margin-top: 6px; }
        .flood-item { background: #f0f8ff; padding: 8px; border-radius: 6px; }
        .flood-item span { display: block; font-weight: 700; color: #111; margin-bottom: 2px; }

        .tabs { display: flex; background: white; border-bottom: 1px solid #ddd; max-width: 600px; margin: 0 auto; }
        .tab-btn { flex: 1; padding: 12px; text-align: center; font-weight: 600; font-size: 0.9rem; border: none; background: none; cursor: pointer; color: #666; }
        .tab-btn.active { color: #1a73e8; border-bottom: 3px solid #1a73e8; }
        
        .container { padding: 12px; max-width: 600px; margin: 0 auto; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        .map-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 16px; }
        .map-card iframe { width: 100%; height: 480px; border: none; }
        
        .card { background: white; border-radius: 12px; padding: 14px; margin-bottom: 12px; box-shadow: 0 2px 6px rgba(0,0,0,0.06); position: relative; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
        .location { font-weight: 700; font-size: 1rem; color: #111; }
        .badge { padding: 4px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; }
        .badge-heavy { background: #ffebee; color: #c62828; }
        .badge-moderate { background: #fff8e1; color: #f57f17; }
        .badge-clear { background: #e8f5e9; color: #2e7d32; }
        .time { font-size: 0.75rem; color: #888; margin-bottom: 8px; }
        .desc { font-size: 0.9rem; color: #444; margin-bottom: 10px; line-height: 1.4; }
        .traffic-img { width: 100%; max-height: 250px; object-fit: cover; border-radius: 8px; margin-bottom: 8px; }
        
        .btn-delete { background: #ffebee; color: #c62828; border: 1px solid #ffcdd2; padding: 6px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: bold; cursor: pointer; float: right; display: none; margin-top: 4px; }
        .admin-mode .btn-delete { display: inline-block; }

        .fab { position: fixed; bottom: 20px; right: 20px; background: #1a73e8; color: white; border: none; padding: 14px 20px; border-radius: 30px; font-weight: bold; box-shadow: 0 4px 12px rgba(26,115,232,0.4); cursor: pointer; display: flex; align-items: center; gap: 8px; font-size: 0.95rem; z-index: 99; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 200; justify-content: center; align-items: flex-end; }
        .modal-content { background: white; width: 100%; max-width: 600px; padding: 20px; border-radius: 16px 16px 0 0; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-weight: 600; font-size: 0.85rem; margin-bottom: 4px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 8px; font-size: 0.9rem; }
        .btn-submit { width: 100%; background: #1a73e8; color: white; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 8px; }
        .btn-close { width: 100%; background: #eee; color: #333; padding: 10px; border: none; border-radius: 8px; font-weight: 600; margin-top: 6px; cursor: pointer; }
    </style>
</head>
<body id="appBody">
    <header>
        <h1>🚦 Cavite – Noveleta Traffic Tracker</h1>
        <div class="clock-banner" id="localClock">🕒 Loading...</div>
        <button id="adminBtn" class="admin-toggle-btn" onclick="toggleAdminMode()">🔒 Admin Mode</button>
    </header>

    <div class="flood-widget">
        <div class="flood-header">
            <span>🌊 Dual Monitor: Flood & Open-Meteo Tide</span>
            <span class="badge badge-clear" id="tideStatusBadge">NORMAL TIDE</span>
        </div>
        <div class="flood-grid">
            <div class="flood-item">
                <span>San Rafael I / Market Status</span>
                <span id="statusMarket" style="color:#2e7d32; font-size:0.75rem;">Passable to all vehicles</span>
            </div>
            <div class="flood-item">
                <span>Open-Meteo Sea Swell & Level</span>
                <span id="statusMarine" style="color:#0288d1; font-size:0.75rem;">Fetching live ocean data...</span>
            </div>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('feed', event)">📷 Live Feed</button>
        <button class="tab-btn" onclick="switchTab('map', event)">🗺️ Interactive Map</button>
    </div>

    <div class="container">
        <div id="feed" class="tab-content active">
            <div id="feed-container">Loading live traffic updates...</div>
        </div>

        <div id="map" class="tab-content">
            <div class="map-card">
                <iframe src="https://embed.waze.com/iframe?zoom=16&lat=14.4275&lon=120.8838&ct=livemap" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <button class="fab" onclick="openModal()">📷 Post Update</button>

    <div class="modal" id="postModal">
        <div class="modal-content">
            <h2 style="font-size: 1.1rem; margin-bottom: 12px;">Report Traffic / Flooding Condition</h2>
            <div class="form-group">
                <label>Location / Road Segment</label>
                <select id="inputLocation">
                    <option>San Rafael I (Manila-Cavite Rd / Market)</option>
                    <option>Noveleta Crossing (Marseilla cor. Magdiwang)</option>
                    <option>Centennial Road (Kawit - Noveleta Border)</option>
                    <option>Cavite - Noveleta Diversion Road</option>
                </select>
            </div>
            <div class="form-group">
                <label>Traffic / Flood Status</label>
                <select id="inputStatus">
                    <option value="Heavy / Flooded">Heavy / Flooded</option>
                    <option value="Heavy">Heavy</option>
                    <option value="Moderate">Moderate</option>
                    <option value="Light / Clear">Light / Clear</option>
                </select>
            </div>
            <div class="form-group">
                <label>Description / Details</label>
                <textarea id="inputDesc" rows="2" placeholder="e.g. High tide flooding near market area..."></textarea>
            </div>
            <div class="form-group">
                <label>Upload Live Photo</label>
                <input type="file" id="inputPhoto" accept="image/*">
            </div>
            <button class="btn-submit" onclick="submitPost()">Publish Update</button>
            <button class="btn-close" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        let isAdmin = false;

        function toggleAdminMode() {
            if (!isAdmin) {
                const pass = prompt("Enter Admin Password:");
                if (pass === "admin123") {
                    isAdmin = true;
                    document.getElementById('appBody').classList.add('admin-mode');
                    document.getElementById('adminBtn').innerText = "🔓 Exit Admin";
                    document.getElementById('adminBtn').classList.add('active');
                    alert("Admin Mode Enabled.");
                } else if (pass !== null) {
                    alert("Incorrect Password!");
                }
            } else {
                isAdmin = false;
                document.getElementById('appBody').classList.remove('admin-mode');
                document.getElementById('adminBtn').innerText = "🔒 Admin Mode";
                document.getElementById('adminBtn').classList.remove('active');
                alert("Admin Mode Disabled.");
            }
        }

        function deletePost(postId) {
            if (!isAdmin) {
                alert("Unauthorized action.");
                return;
            }
            if (confirm("Are you sure you want to delete this traffic update?")) {
                db.ref('traffic_updates/' + postId).remove().catch((error) => {
                    alert("Failed to delete: " + error.message);
                });
            }
        }

        function updateClock() {
            const now = new Date();
            const options = { 
                timeZone: 'Asia/Manila', 
                weekday: 'short', 
                month: 'short', 
                day: 'numeric', 
                hour: '2-digit', 
                minute: '2-digit', 
                second: '2-digit',
                hour12: true 
            };
            document.getElementById('localClock').innerText = '🕒 PHT: ' + now.toLocaleString('en-US', options);
        }
        setInterval(updateClock, 1000);
        updateClock();

        async function fetchMarineTide() {
            const lat = 14.4275;
            const lon = 120.8838;
            const url = `https://marine-api.open-meteo.com/v1/marine?latitude=${lat}&longitude=${lon}&current=wave_height,ocean_current_velocity,sea_surface_temperature`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                
                if (data && data.current) {
                    const waveHeight = data.current.wave_height || 0;
                    document.getElementById('statusMarine').innerText = `🌊 Sea Swell: ${waveHeight.toFixed(2)}m`;
                    
                    if (waveHeight >= 1.0) {
                        document.getElementById('tideStatusBadge').innerText = 'HIGH TIDE SWELL';
                        document.getElementById('tideStatusBadge').className = 'badge badge-heavy';
                    }
                }
            } catch (err) {
                console.error("Failed to load marine API data:", err);
                document.getElementById('statusMarine').innerText = 'Manila Bay Tide Active';
            }
        }
        fetchMarineTide();
        setInterval(fetchMarineTide, 15 * 60 * 1000);

        const firebaseConfig = {
            apiKey: "AIzaSyBGhH2ZX7u6cKD1VFrGSxSE6x5fX1mYaE",
            authDomain: "noveleta-traffic.firebaseapp.com",
            databaseURL: "https://noveleta-traffic-default-rtdb.firebaseio.com",
            projectId: "noveleta-traffic",
            storageBucket: "noveleta-traffic.firebasestorage.app",
            messagingSenderId: "747282048294",
            appId: "1:747282048294:web:49504aa2c1eb65fb840de7",
            measurementId: "G-LLFT1686H2"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const storage = firebase.storage();

        function getTimeAgo(timestamp) {
            if (!timestamp) return "Just now";
            const seconds = Math.floor((Date.now() - timestamp) / 1000);
            if (seconds < 60) return "Just now";
            const minutes = Math.floor(seconds / 60);
            if (minutes < 60) return `${minutes} min${minutes > 1 ? 's' : ''} ago`;
            const hours = Math.floor(minutes / 60);
            if (hours < 24) return `${hours} hr${hours > 1 ? 's' : ''} ago`;
            return `${Math.floor(hours / 24)} day(s) ago`;
        }

        db.ref('traffic_updates').orderByChild('timestamp').on('value', (snapshot) => {
            const feedContainer = document.getElementById('feed-container');
            feedContainer.innerHTML = '';

            const posts = [];
            let hasFlooding = false;

            snapshot.forEach((childSnapshot) => {
                const key = childSnapshot.key;
                const post = childSnapshot.val();
                post.id = key; 
                posts.push(post);

                if (post.status && post.status.includes('Flooded')) {
                    hasFlooding = true;
                }
            });

            if (hasFlooding) {
                document.getElementById('tideStatusBadge').innerText = 'FLOOD WARNING';
                document.getElementById('tideStatusBadge').className = 'badge badge-heavy';
                document.getElementById('statusMarket').innerText = '⚠️ Caution: Flooding reported';
                document.getElementById('statusMarket').style.color = '#c62828';
            } else {
                document.getElementById('statusMarket').innerText = 'Passable to all vehicles';
                document.getElementById('statusMarket').style.color = '#2e7d32';
            }

            posts.reverse();

            if (posts.length === 0) {
                feedContainer.innerHTML = '<p style="text-align:center; padding: 20px; color: #888;">No traffic updates posted yet. Be the first to post!</p>';
                return;
            }

            posts.forEach(post => {
                let badgeClass = 'badge-clear';
                if (post.status.includes('Heavy')) badgeClass = 'badge-heavy';
                if (post.status.includes('Moderate')) badgeClass = 'badge-moderate';

                const cardHTML = `
                    <div class="card">
                        <div class="card-header">
                            <span class="location">${post.location}</span>
                            <span class="badge ${badgeClass}">${post.status}</span>
                        </div>
                        <div class="time">🕒 ${getTimeAgo(post.timestamp)}</div>
                        <div class="desc">${post.desc}</div>
                        ${post.image ? `<img src="${post.image}" class="traffic-img" alt="Traffic Photo">` : ''}
                        <div>
                            <button class="btn-delete" onclick="deletePost('${post.id}')">🗑️ Delete Post</button>
                            <div style="clear: both;"></div>
                        </div>
                    </div>
                `;
                feedContainer.innerHTML += cardHTML;
            });
        });

        function submitPost() {
            const location = document.getElementById('inputLocation').value;
            const status = document.getElementById('inputStatus').value;
            const desc = document.getElementById('inputDesc').value;
            const photoInput = document.getElementById('inputPhoto');

            if (!desc) {
                alert("Please add a short description.");
                return;
            }

            const submitBtn = document.querySelector('.btn-submit');
            submitBtn.innerText = "Uploading Photo...";
            submitBtn.disabled = true;

            const newPostRef = db.ref('traffic_updates').push();
            const postId = newPostRef.key;

            const postData = {
                location: location,
                status: status,
                desc: desc,
                timestamp: firebase.database.ServerValue.TIMESTAMP,
                image: ''
            };

            if (photoInput.files && photoInput.files[0]) {
                const file = photoInput.files[0];
                const storageRef = storage.ref(`traffic_images/${postId}_${file.name}`);

                storageRef.put(file).then((snapshot) => {
                    return snapshot.ref.getDownloadURL();
                }).then((downloadURL) => {
                    postData.image = downloadURL;
                    return newPostRef.set(postData);
                }).then(() => {
                    closeModal();
                    resetForm();
                    submitBtn.innerText = "Publish Update";
                    submitBtn.disabled = false;
                }).catch((error) => {
                    alert("Upload failed: " + error.message);
                    submitBtn.innerText = "Publish Update";
                    submitBtn.disabled = false;
                });
            } else {
                newPostRef.set(postData).then(() => {
                    closeModal();
                    resetForm();
                    submitBtn.innerText = "Publish Update";
                    submitBtn.disabled = false;
                });
            }
        }

        function resetForm() {
            document.getElementById('inputDesc').value = '';
            document.getElementById('inputPhoto').value = '';
        }

        function switchTab(tabId, evt) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            if (evt && evt.target) {
                evt.target.classList.add('active');
            }
        }

        function openModal() { document.getElementById('postModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('postModal').style.display = 'none'; }
    </script>
</body>
</html>
